version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: accessflow-db
    environment:
      POSTGRES_DB: accessflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accessflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accessflow-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: accessflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-production-secret-key-change-this-in-production-at-least-32-chars
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - accessflow-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  accessflow-network:
    driver: bridge
